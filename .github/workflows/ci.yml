name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rdbhs_pilot
          POSTGRES_PASSWORD: pilot-only
          POSTGRES_DB: rdbhs_cicd_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdbhs_pilot -d rdbhs_cicd_pilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://rdbhs_pilot:pilot-only@127.0.0.1:5432/rdbhs_cicd_pilot
      SECRET_KEY: ci-only-synthetic-secret-key-never-used-in-production
      DEBUG: 'false'
      SSO_ENABLED: 'false'
      ALLOWED_HOSTS: localhost,testserver
      CSRF_TRUSTED_ORIGINS: https://localhost
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pilot tools
        run: python -m pip install uv==0.9.17 ansible-core==2.19.3
      - name: Validate artifact safety and Ansible syntax
        run: |
          python -m unittest discover -s deploy/tests -v
          ansible-playbook -i localhost, deploy/ansible/rehearse.yml --syntax-check
      - name: Install the locked application environment
        run: uv sync --locked --no-dev
      - name: Check migrations and run PostgreSQL tests
        env:
          DEBUG: 'true'
        run: |
          uv run --no-sync python manage.py check
          uv run --no-sync python manage.py makemigrations --check --dry-run
          uv run --no-sync python manage.py test core --noinput
      - name: Export the tested Git revision
        run: |
          python deploy/build_release.py --revision "$GITHUB_SHA" --output dist/release
          python deploy/verify_release.py dist/release --expected-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdbhs-backoffice-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
