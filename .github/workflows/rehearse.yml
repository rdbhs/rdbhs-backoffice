name: Manual deployment rehearsal

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run from a push to main; deploy its existing artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rdbhs-backoffice-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rdbhs_pilot
          POSTGRES_PASSWORD: pilot-only
          POSTGRES_DB: rdbhs_cicd_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdbhs_pilot -d rdbhs_cicd_pilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the source workflow before downloading anything
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['CI_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('Expected a numeric CI run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          expected = {'event': 'push', 'head_branch': 'main', 'conclusion': 'success', 'status': 'completed', 'path': '.github/workflows/ci.yml'}
          if any(run.get(k) != v for k, v in expected.items()):
              raise SystemExit('Only successful CI runs from pushes to main are accepted')
          if run['head_repository']['full_name'] != repo:
              raise SystemExit('Artifacts from another repository are forbidden')
          sha = run['head_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid source commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={sha}\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rdbhs-backoffice-${{ steps.source.outputs.commit }}
          path: downloaded-release
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Install pilot tools
        run: python -m pip install uv==0.9.17 ansible-core==2.19.3
      - name: Rehearse the existing artifact, including a failed activation
        env:
          DATABASE_URL: postgresql://rdbhs_pilot:pilot-only@127.0.0.1:5432/rdbhs_cicd_pilot
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: >-
          python deploy/rehearse.py downloaded-release
          --expected-commit "$EXPECTED_COMMIT"
          --external-pilot-database --report rehearsal-result.json
      - name: Save rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdbhs-rehearsal-${{ github.run_id }}
          path: rehearsal-result.json
          retention-days: 7
