{% load static %}
<aside class="navbar navbar-vertical navbar-expand-lg rdbhs-sidebar" aria-label="Application sidebar">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}" aria-label="RDBHS Backoffice home">
      <img class="rdbhs-sidebar-logo" src="{% static 'img/rdbhs-logo-mono.png' %}" width="2172" height="724" alt="Right Direction Behavioral Health Services">
      <span class="rdbhs-sidebar-caption">Backoffice</span>
    </a>
    <nav class="w-100" aria-label="Main navigation">
      <ul class="navbar-nav">
        <li class="nav-section-title">Management</li>
        <li class="nav-item">
          <a class="nav-link {% if view.cv_viewset.name == 'employee' %}active{% endif %}" {% if view.cv_viewset.name == 'employee' %}aria-current="page"{% endif %} href="{% url 'employee-list' %}">
            <span class="nav-link-icon"><svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /><path d="M21 21v-2a4 4 0 0 0 -3 -3.85" /></svg></span>
            <span class="nav-link-title">Employees</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if view.cv_viewset.name == 'employment_type' %}active{% endif %}" {% if view.cv_viewset.name == 'employment_type' %}aria-current="page"{% endif %} href="{% url 'employment_type-list' %}">
            <span class="nav-link-icon"><svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 9a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -9" /><path d="M8 7v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2" /><path d="M12 12l0 .01" /><path d="M3 13a20 20 0 0 0 18 0" /></svg></span>
            <span class="nav-link-title">Employment Types</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if view.cv_viewset.name == 'productivity_goal' %}active{% endif %}" {% if view.cv_viewset.name == 'productivity_goal' %}aria-current="page"{% endif %} href="{% url 'productivity_goal-list' %}">
            <span class="nav-link-icon"><svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M7 12a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /></svg></span>
            <span class="nav-link-title">Productivity Goals</span>
          </a>
        </li>
        <li class="nav-section-title">System</li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'admin' %}active{% endif %}" {% if request.resolver_match.app_name == 'admin' %}aria-current="page"{% endif %} href="{% url 'admin:index' %}">
            <span class="nav-link-icon"><svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg></span>
            <span class="nav-link-title">Administration</span>
          </a>
        </li>
      </ul>
    </nav>
    {% if user.is_authenticated %}
    <div class="mt-3 px-3">
      <div class="small text-break">{{ user.email|default:user.username }}</div>
      <a class="nav-link mt-2" href="{% url 'socialaccount_connections' %}">Account connections</a>
      <form method="post" action="{% url 'account_logout' %}" class="mt-2">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
      </form>
    </div>
    {% endif %}
  </div>
</aside>
